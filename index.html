<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Campeonato — Acompanhe</title>
<style>
  :root {
    --bg: #0b1120;
    --card: #0f172a;
    --border: rgba(255,255,255,0.08);
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #3b82f6;
    --gold: #facc15;
    --green: #10b981;
    --red: #ef4444;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: rgba(15,23,42,0.1);
      --text: #0f172a;
      --muted: #64748b;
    }
  }
  /* Escolha manual do tema (botão no header) sempre vence o padrão do sistema, nos dois sentidos. */
  :root[data-theme="dark"] {
    --bg: #0b1120;
    --card: #0f172a;
    --border: rgba(255,255,255,0.08);
    --text: #e2e8f0;
    --muted: #64748b;
  }
  :root[data-theme="light"] {
    --bg: #f1f5f9;
    --card: #ffffff;
    --border: rgba(15,23,42,0.1);
    --text: #0f172a;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding-bottom: 2rem;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1rem 0.7rem;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
  }
  h1 {
    margin: 0 0 0.15rem;
    font-size: 1.15rem;
  }
  .header-actions {
    display: flex;
    gap: 0.5rem;
    flex-shrink: 0;
  }
  /* Barra de ações rápidas (Atualizar / Compartilhar) — botões grandes e com texto, bem visíveis */
  .quick-actions {
    display: flex;
    gap: 0.5rem;
    padding: 0.7rem 1rem 0;
    max-width: 640px;
    margin: 0 auto;
  }
  .qa-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.65rem;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
  }
  .qa-btn:active { transform: scale(0.97); }
  .qa-btn.share {
    background: #25d366;
    border-color: #25d366;
    color: #fff;
  }
  .qa-icon { display: inline-block; }
  .qa-icon.spinning { animation: qa-spin 0.8s linear infinite; }
  @keyframes qa-spin { to { transform: rotate(360deg); } }
  .theme-toggle {
    flex-shrink: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    width: 2.2rem;
    height: 2.2rem;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .today-games {
    margin-bottom: 0.5rem;
  }
  .today-games .card {
    border-color: rgba(59,130,246,0.35);
  }
  .today-game-stage {
    font-size: 0.68rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.03rem;
    font-weight: 800;
    margin-top: 0.5rem;
  }
  .today-game-stage:first-child {
    margin-top: 0;
  }
  .updated {
    color: var(--muted);
    font-size: 0.75rem;
  }
  .tabs {
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    padding: 0.7rem 1rem 0;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    flex: 0 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  main {
    padding: 1rem;
    max-width: 640px;
    margin: 0 auto;
  }
  .section-title {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.05rem;
    text-transform: uppercase;
    color: var(--muted);
    margin: 1.25rem 0 0.5rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.8rem 0.9rem;
    margin-bottom: 0.7rem;
  }
  .card h3 {
    margin: 0 0 0.5rem;
    font-size: 0.95rem;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }
  th, td {
    text-align: left;
    padding: 0.3rem 0.35rem;
  }
  th {
    color: var(--muted);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.03rem;
    border-bottom: 1px solid var(--border);
  }
  td {
    border-bottom: 1px solid var(--border);
  }
  tr:last-child td { border-bottom: none; }
  tr:first-child td { font-weight: 800; color: var(--gold); }
  /* Zona de classificação: os 2 primeiros de cada grupo */
  tr.q td { background: rgba(16,185,129,0.07); }
  tr.q td:first-child { border-left: 3px solid var(--green); }
  .table-legend {
    margin-top: 0.4rem;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--green);
  }
  /* Chips de atalho pra pular direto a cada seção da página */
  .jump-row {
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 0.3rem;
    margin-bottom: 0.5rem;
  }
  .jump-chip {
    flex: 0 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }
  .section-title { scroll-margin-top: 4.5rem; }
  /* Vencedor em destaque nos confrontos já jogados */
  .match-team.winner { font-weight: 800; }
  .match-team.loser { color: var(--muted); }
  /* Botão flutuante de voltar ao topo (a página fica longa no celular) */
  #topBtn {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 20;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--accent);
    color: #fff;
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #topBtn.show { opacity: 1; pointer-events: auto; }
  .match-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .match-row:last-child { border-bottom: none; }
  .match-team { flex: 1; }
  .match-team.right { text-align: right; }
  .match-score {
    font-weight: 800;
    padding: 0.15rem 0.6rem;
    border-radius: 6px;
    background: rgba(59,130,246,0.12);
    color: var(--accent);
    white-space: nowrap;
  }
  .match-pending {
    color: var(--muted);
    font-size: 0.75rem;
    white-space: nowrap;
  }
  .match-score-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
  }
  .match-date {
    color: var(--muted);
    font-size: 0.65rem;
    white-space: nowrap;
  }
  .team-match-row.clickable {
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .team-match-row.clickable:hover {
    background: rgba(59,130,246,0.06);
  }
  .team-match-hint {
    display: block;
    text-align: center;
    font-size: 0.68rem;
    color: var(--accent);
    font-weight: 700;
    margin-top: -0.2rem;
    padding-bottom: 0.2rem;
  }
  .champion-banner {
    background: linear-gradient(135deg, rgba(250,204,21,0.15), rgba(250,204,21,0.03));
    border: 1px solid rgba(250,204,21,0.4);
    border-radius: 10px;
    padding: 0.9rem;
    text-align: center;
    margin-bottom: 1rem;
    font-weight: 800;
    color: var(--gold);
  }
  .empty {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 0.5rem 0;
  }
  .error-banner {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.35);
    color: var(--red);
    border-radius: 8px;
    padding: 0.7rem 0.9rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }
  .channel-card {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.7rem 1rem;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .channel-avatar-wrap {
    position: relative;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
  }
  .channel-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .channel-avatar-fallback {
    display: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #1e293b);
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    position: absolute;
    top: 0;
    left: 0;
  }
  .channel-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .channel-name {
    font-weight: 800;
    font-size: 0.95rem;
  }
  .channel-sub {
    font-size: 0.7rem;
    color: var(--muted);
  }
  .channel-live-btn {
    flex-shrink: 0;
    background: #ff0000;
    color: white;
    font-weight: 800;
    font-size: 0.75rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    text-decoration: none;
    white-space: nowrap;
  }
  .support-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.7rem;
    padding: 0.6rem 1rem;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .support-btn {
    align-self: flex-start;
    margin-top: 0.4rem;
    background: #22c55e;
    color: white;
    font-weight: 800;
    font-size: 0.72rem;
    padding: 0.4rem 0.8rem;
    border-radius: 999px;
    text-decoration: none;
    white-space: nowrap;
  }
  .support-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .support-title {
    font-weight: 800;
    font-size: 0.9rem;
  }
  .support-sub {
    font-size: 0.7rem;
    color: var(--muted);
  }
  .support-qr-link {
    flex-shrink: 0;
    line-height: 0;
  }
  .support-qr {
    width: 54px;
    height: 54px;
    background: #fff;
    border-radius: 8px;
    padding: 4px;
    display: flex;
  }
  .support-qr svg {
    width: 100%;
    height: 100%;
  }
  .team-select-row {
    margin-bottom: 1rem;
  }
  .team-select {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 0.7rem;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 700;
    font-family: inherit;
  }
  .team-view-header {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 1rem;
  }
  .team-view-header h2 {
    margin: 0;
    font-size: 1.1rem;
  }
  .back-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.4rem 0.7rem;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }
  .team-match-stage {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03rem;
    font-weight: 800;
    margin-bottom: 0.3rem;
  }
  .team-match-events {
    margin-top: 0.5rem;
    padding-top: 0.5rem;
    border-top: 1px dashed var(--border);
    display: none;
    flex-direction: column;
    gap: 0.3rem;
  }
  .team-match-events.open {
    display: flex;
  }
  .event-line {
    font-size: 0.78rem;
  }
  .event-minute {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 800;
    color: var(--muted);
    background: rgba(100,116,139,0.15);
    border-radius: 4px;
    padding: 0.05rem 0.3rem;
    margin-right: 0.3rem;
  }
  .event-team {
    color: var(--muted);
  }
</style>
</head>

<script>
let snapshot = null;
let activeCategoryId = null;
let selectedTeam = null; // null = visão geral da categoria; senão, nome do time em foco

// Mesmo mapa de país->código do app principal (utils/flags.js), só que aqui vira emoji de bandeira
// na hora (em vez de SVG) — o site público só roda no celular da galera, onde emoji de bandeira
// renderiza liso (diferente do telão em Windows, que precisa de SVG de verdade).
const COUNTRY_CODES = {
  ITALIA: 'IT', 'ARABIA SAUDITA': 'SA', VENEZUELA: 'VE', SENEGAL: 'SN', INGLATERRA: 'GB',
  UGANDA: 'UG', SUECIA: 'SE', UCRANIA: 'UA', PORTUGAL: 'PT', GRECIA: 'GR', COLOMBIA: 'CO',
  BRASIL: 'BR', ARGENTINA: 'AR', FRANCA: 'FR', GANA: 'GH', HAITI: 'HT', ESPANHA: 'ES',
  HOLANDA: 'NL', 'PAISES BAIXOS': 'NL', ALEMANHA: 'DE', 'ESTADOS UNIDOS': 'US', EUA: 'US',
  MEXICO: 'MX', JAPAO: 'JP', 'COREIA DO SUL': 'KR', MARROCOS: 'MA', CROACIA: 'HR', BELGICA: 'BE',
  SUICA: 'CH', DINAMARCA: 'DK', POLONIA: 'PL', SERVIA: 'RS', TUNISIA: 'TN', CAMAROES: 'CM',
  CANADA: 'CA', AUSTRALIA: 'AU', IRA: 'IR', CATAR: 'QA', QATAR: 'QA', EQUADOR: 'EC', URUGUAI: 'UY',
  CHILE: 'CL', PARAGUAI: 'PY', BOLIVIA: 'BO', PERU: 'PE', 'PAIS DE GALES': 'GB', IRLANDA: 'IE',
  AUSTRIA: 'AT', ROMENIA: 'RO', TURQUIA: 'TR', RUSSIA: 'RU', ESLOVAQUIA: 'SK', HUNGRIA: 'HU',
  FINLANDIA: 'FI', NORUEGA: 'NO', ISLANDIA: 'IS', EGITO: 'EG', NIGERIA: 'NG', ARGELIA: 'DZ',
  'COSTA DO MARFIM': 'CI', 'AFRICA DO SUL': 'ZA', CHINA: 'CN', INDIA: 'IN', 'NOVA ZELANDIA': 'NZ',
  JAMAICA: 'JM', 'COSTA RICA': 'CR', PANAMA: 'PA', HONDURAS: 'HN', CUBA: 'CU', GUATEMALA: 'GT',
};
const SPECIAL_FLAGS = { ESCOCIA: '🏴󠁧󠁢󠁳󠁣󠁴󠁿' };

function stripAccents(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, ''); }

function isoToEmoji(code) {
  return code.toUpperCase().replace(/./g, (c) => String.fromCodePoint(127397 + c.charCodeAt(0)));
}

function teamFlag(name) {
  const key = stripAccents((name || '').trim().toUpperCase());
  if (SPECIAL_FLAGS[key]) return SPECIAL_FLAGS[key] + ' ';
  const code = COUNTRY_CODES[key];
  return code ? isoToEmoji(code) + ' ' : '';
}

function teamLabel(name) {
  return teamFlag(name) + (name || '');
}

function fmtUpdated(iso) {
  if (!iso) return 'Ainda não publicado';
  const d = new Date(iso);
  return 'Atualizado em ' + d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function matchLine(m) {
  const pending = !m.played;
  const dateLabel = m.date ? (formatDate(m.date) + (m.time ? ' ' + m.time : '')) : '';
  // Quem venceu fica em negrito e o perdedor esmaece (considerando pênaltis no empate).
  let clsA = 'match-team', clsB = 'match-team right';
  if (!pending) {
    const aWins = m.scoreA !== m.scoreB ? m.scoreA > m.scoreB : (m.penA != null && m.penA > m.penB);
    const bWins = m.scoreA !== m.scoreB ? m.scoreB > m.scoreA : (m.penB != null && m.penB > m.penA);
    if (aWins) { clsA += ' winner'; clsB += ' loser'; }
    else if (bWins) { clsB += ' winner'; clsA += ' loser'; }
  }
  return '<div class="match-row">' +
    '<span class="' + clsA + '">' + teamLabel(m.teamA) + '</span>' +
    (pending
      ? '<span class="match-pending">' + (dateLabel || 'a definir') + '</span>'
      : '<span class="match-score-wrap"><span class="match-score">' + m.scoreA + ' x ' + m.scoreB + (m.penA != null ? ' (pen. ' + m.penA + 'x' + m.penB + ')' : '') + '</span>' + (dateLabel ? '<span class="match-date">' + dateLabel + '</span>' : '') + '</span>') +
    '<span class="' + clsB + '">' + teamLabel(m.teamB) + '</span>' +
    '</div>';
}

function formatDate(d) {
  const parts = (d || '').split('-');
  if (parts.length !== 3) return d;
  return parts[2] + '/' + parts[1];
}

function formatEventMinute(ev) {
  if (ev.clockElapsed == null) return '';
  const minute = Math.floor(ev.clockElapsed / 60) + 1;
  const periodLabel = ev.period === 2 ? '2ºT' : '1ºT';
  return '<span class="event-minute">' + periodLabel + ' ' + minute + "'" + '</span>';
}

function eventLine(ev) {
  const icon = ev.type === 'goal' ? '⚽' : ev.type === 'yellow' ? '🟨' : '🟥';
  const who = ev.number ? 'Nº ' + ev.number + ' ' + (ev.name || '') : (ev.name || 'Não identificado');
  const assist = ev.type === 'goal' && ev.assistName ? ' · assist. ' + (ev.assistNumber ? 'Nº ' + ev.assistNumber + ' ' : '') + ev.assistName : '';
  const second = ev.viaSecondYellow ? ' · 2º amarelo' : '';
  return '<div class="event-line">' + formatEventMinute(ev) + icon + ' ' + who + assist + second + ' <span class="event-team">(' + teamLabel(ev.teamName) + ')</span></div>';
}

// Junta os confrontos (grupo + mata-mata) de um time só, pra visão "Meu Time" — cada partida
// mostra o placar/data igual ao resto do site, e se já foi jogada, lista os gols/cartões dela.
function renderTeamView(cat, teamName) {
  const matches = [];
  cat.groups.forEach((g) => {
    g.matches.forEach((m) => {
      if (m.teamA === teamName || m.teamB === teamName) matches.push({ ...m, stage: g.name });
    });
  });
  cat.knockout.forEach((r) => {
    r.matches.forEach((m) => {
      if (m.teamA === teamName || m.teamB === teamName) matches.push({ ...m, stage: r.name });
    });
  });

  let html = '<div class="team-view-header"><button class="back-btn" id="backBtn">← Voltar</button><h2>' + teamLabel(teamName) + '</h2></div>';

  if (!matches.length) {
    html += '<div class="empty">Nenhum confronto encontrado pra esse time ainda.</div>';
  } else {
    matches.forEach((m, idx) => {
      const hasEvents = m.played && (m.events || []).length > 0;
      html += '<div class="card"><div class="team-match-stage">' + m.stage + '</div>';
      html += '<div class="' + (hasEvents ? 'team-match-row clickable' : 'team-match-row') + '"' + (hasEvents ? ' data-idx="' + idx + '"' : '') + '>';
      html += matchLine(m);
      if (hasEvents) html += '<span class="team-match-hint">Toque pra ver a súmula ▾</span>';
      html += '</div>';
      if (hasEvents) {
        html += '<div class="team-match-events" id="events-' + idx + '">' + m.events.map(eventLine).join('') + '</div>';
      }
      html += '</div>';
    });
  }

  document.getElementById('main').innerHTML = html;
  document.getElementById('backBtn').addEventListener('click', () => {
    selectedTeam = null;
    renderCategory(cat);
  });
  document.querySelectorAll('.team-match-row.clickable').forEach((row) => {
    row.addEventListener('click', () => {
      const evEl = document.getElementById('events-' + row.dataset.idx);
      const hint = row.querySelector('.team-match-hint');
      const nowOpen = evEl.classList.toggle('open');
      if (hint) hint.textContent = nowOpen ? 'Toque pra fechar ▴' : 'Toque pra ver a súmula ▾';
    });
  });
}

function renderCategory(cat) {
  let html = '';

  const teamNames = [...new Set(cat.groups.flatMap((g) => g.standings.map((s) => s.name)))].sort();
  html += '<div class="team-select-row"><select id="teamSelect" class="team-select">' +
    '<option value="">🔎 Ver súmula por time...</option>' +
    teamNames.map((t) => '<option value="' + t.replace(/"/g, '&quot;') + '">' + teamLabel(t) + '</option>').join('') +
    '</select></div>';

  if (cat.champion) {
    html += '<div class="champion-banner">🏆 CAMPEÃO: ' + teamLabel(cat.champion.champion) + '<br><span style="font-weight:400;font-size:0.8rem;">Vice: ' + teamLabel(cat.champion.runnerUp) + '</span></div>';
  }

  // Atalhos pra pular direto a cada seção (a página fica longa no celular)
  html += '<div class="jump-row">' +
    '<a class="jump-chip" href="#sec-class">📊 Classificação</a>' +
    '<a class="jump-chip" href="#sec-conf">⚔️ Confrontos</a>' +
    '<a class="jump-chip" href="#sec-mata">🏟️ Mata-mata</a>' +
    (cat.topScorers.length ? '<a class="jump-chip" href="#sec-art">⚽ Artilheiros</a>' : '') +
    (cat.topCards.length ? '<a class="jump-chip" href="#sec-cards">🟨 Cartões</a>' : '') +
    '</div>';

  html += '<div class="section-title" id="sec-class">Classificação</div>';
  if (!cat.groups.length) {
    html += '<div class="empty">Nenhum grupo cadastrado ainda.</div>';
  }
  cat.groups.forEach((g) => {
    html += '<div class="card"><h3>' + g.name + '</h3>';
    if (!g.standings.length) {
      html += '<div class="empty">Sem times ainda.</div>';
    } else {
      html += '<table><thead><tr><th>Time</th><th>PJ</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>Pts</th></tr></thead><tbody>';
      g.standings.forEach((t, idx) => {
        html += '<tr' + (idx < 2 ? ' class="q"' : '') + '><td>' + teamLabel(t.name) + '</td><td>' + t.pj + '</td><td>' + t.v + '</td><td>' + t.e + '</td><td>' + t.d + '</td><td>' + (t.gp - t.gc) + '</td><td>' + t.pts + '</td></tr>';
      });
      html += '</tbody></table>';
      html += '<div class="table-legend">▎Os 2 primeiros se classificam</div>';
    }
    html += '</div>';
  });

  html += '<div class="section-title" id="sec-conf">Confrontos</div>';
  cat.groups.forEach((g) => {
    if (!g.matches.length) return;
    html += '<div class="card"><h3>' + g.name + '</h3>';
    g.matches.forEach((m) => { html += matchLine(m); });
    html += '</div>';
  });
  if (cat.groups.every((g) => !g.matches.length)) {
    html += '<div class="empty">Nenhum confronto sorteado ainda.</div>';
  }

  html += '<div class="section-title" id="sec-mata">Mata-mata</div>';
  const hasKnockout = cat.knockout.some((r) => r.matches.length);
  if (!hasKnockout) {
    html += '<div class="empty">Ainda não começou.</div>';
  } else {
    cat.knockout.forEach((r) => {
      if (!r.matches.length) return;
      html += '<div class="card"><h3>' + r.name + '</h3>';
      r.matches.forEach((m) => { html += matchLine(m); });
      html += '</div>';
    });
  }

  if (cat.topScorers.length) {
    html += '<div class="section-title" id="sec-art">⚽ Artilheiros</div><div class="card"><table><thead><tr><th>Jogador</th><th>Time</th><th>Gols</th><th>Assist.</th></tr></thead><tbody>';
    cat.topScorers.forEach((p) => {
      html += '<tr><td>' + (p.number ? 'Nº ' + p.number + ' ' : '') + p.name + '</td><td>' + teamLabel(p.teamName) + '</td><td>' + p.goals + '</td><td>' + p.assists + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  if (cat.topCards.length) {
    html += '<div class="section-title" id="sec-cards">🟨🟥 Cartões</div><div class="card"><table><thead><tr><th>Jogador</th><th>Time</th><th>Am.</th><th>Verm.</th></tr></thead><tbody>';
    cat.topCards.forEach((p) => {
      html += '<tr><td>' + (p.number ? 'Nº ' + p.number + ' ' : '') + p.name + '</td><td>' + teamLabel(p.teamName) + '</td><td>' + p.yellow + '</td><td>' + p.red + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  document.getElementById('main').innerHTML = html;
  document.getElementById('teamSelect').addEventListener('change', (e) => {
    if (e.target.value) {
      selectedTeam = e.target.value;
      renderTeamView(cat, selectedTeam);
    }
  });
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = snapshot.categories.map((c) =>
    '<button class="tab ' + (c.id === activeCategoryId ? 'active' : '') + '" data-id="' + c.id + '">' + c.name + '</button>'
  ).join('');
  tabs.querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      activeCategoryId = btn.dataset.id;
      selectedTeam = null;
      renderTabs();
      const cat = snapshot.categories.find((c) => c.id === activeCategoryId);
      if (cat) renderCategory(cat);
    });
  });
}

// "YYYY-MM-DD" de hoje, no fuso do próprio aparelho de quem tá vendo — usado só pra achar os jogos
// marcados pra hoje entre TODAS as categorias, sem precisar que o operador configure nada.
function todayStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function renderTodayGames() {
  const today = todayStr();
  const games = [];
  snapshot.categories.forEach((cat) => {
    cat.groups.forEach((g) => {
      g.matches.forEach((m) => {
        if (m.date === today) games.push({ ...m, categoryName: cat.name, stage: g.name });
      });
    });
    cat.knockout.forEach((r) => {
      r.matches.forEach((m) => {
        if (m.date === today) games.push({ ...m, categoryName: cat.name, stage: r.name });
      });
    });
  });
  games.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

  const el = document.getElementById('todayGames');
  if (!games.length) { el.innerHTML = ''; return; }

  let html = '<div class="section-title">📅 Jogos de Hoje</div><div class="card">';
  games.forEach((m) => {
    html += '<div class="today-game-stage">' + m.categoryName + ' · ' + m.stage + '</div>' + matchLine(m);
  });
  html += '</div>';
  el.innerHTML = html;
}

async function load() {
  try {
    const res = await fetch('./data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    snapshot = await res.json();
    document.getElementById('updated').textContent = fmtUpdated(snapshot.generatedAt);
    if (!snapshot.categories || !snapshot.categories.length) {
      document.getElementById('todayGames').innerHTML = '';
      document.getElementById('tabs').innerHTML = '';
      document.getElementById('main').innerHTML = '<div class="empty">O campeonato ainda não foi publicado. Volte mais tarde.</div>';
      return;
    }
    renderTodayGames();
    if (!activeCategoryId || !snapshot.categories.some((c) => c.id === activeCategoryId)) {
      activeCategoryId = snapshot.categories[0].id;
    }
    renderTabs();
    const cat = snapshot.categories.find((c) => c.id === activeCategoryId);
    if (selectedTeam && cat && cat.groups.some((g) => g.standings.some((s) => s.name === selectedTeam))) {
      renderTeamView(cat, selectedTeam);
    } else {
      selectedTeam = null;
      renderCategory(cat);
    }
  } catch (err) {
    document.getElementById('main').innerHTML = '<div class="error-banner">Não deu pra carregar os dados agora. Puxe a tela pra baixo pra tentar de novo.</div>';
  }
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'light' ? '🌙' : '☀️';
  localStorage.setItem('theme', theme);
}

const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'light' || savedTheme === 'dark') applyTheme(savedTheme);
else document.getElementById('themeToggle').textContent = window.matchMedia('(prefers-color-scheme: light)').matches ? '🌙' : '☀️';

document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme')
    || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyTheme(current === 'light' ? 'dark' : 'light');
});

// Compartilhar: usa o menu nativo do celular (WhatsApp, Instagram etc. já aparecem sozinhos ali)
// quando existe; sem isso (navegador de computador), cai direto num link do WhatsApp Web.
document.getElementById('shareBtn').addEventListener('click', async () => {
  const url = 'https://worldkkevin-boop.github.io/placar-esportivo-site/';
  const text = '🏆 Acompanhe o campeonato ao vivo — grupos, confrontos e artilheiros:';
  if (navigator.share) {
    try { await navigator.share({ title: 'Campeonato', text, url }); } catch (_e) { /* usuário cancelou o compartilhamento */ }
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank');
  }
});

// Atualizar na mão (além do refresh automático a cada 45s) — o ícone gira enquanto carrega.
document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  const icon = btn.querySelector('.qa-icon');
  btn.disabled = true;
  icon.classList.add('spinning');
  document.getElementById('updated').textContent = 'Atualizando...';
  await load();
  icon.classList.remove('spinning');
  btn.disabled = false;
});

// Botão flutuante de voltar ao topo — aparece depois de rolar uma tela.
const topBtn = document.getElementById('topBtn');
window.addEventListener('scroll', () => {
  topBtn.classList.toggle('show', window.scrollY > window.innerHeight);
}, { passive: true });
topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

load();
setInterval(load, 45000);
</script>
